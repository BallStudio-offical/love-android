name: build

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4G'"
    steps:
    - name: Prepare Environment
      run: sudo apt-get update && curl -Lo kitware-archive.sh https://apt.kitware.com/kitware-archive.sh && sudo bash ./kitware-archive.sh
      
    - name: Install Dependencies
      run: sudo apt-get install ninja-build cmake
      
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: adopt-hotspot
        java-version: 17
        cache: gradle

    # ==========================================
    # СБОРКА DEBUG (Для теста на телефоне)
    # ==========================================
    - name: Build Embed Debug APK
      if: ${{ matrix.build_type == 'Debug' }}
      run: bash ./gradlew assembleEmbedNoRecordDebug

    - name: Artifact (Bottle Flip Debug APK)
      if: ${{ matrix.build_type == 'Debug' }}
      uses: actions/upload-artifact@v4
      with:
        name: Bottle-Flip-Debug
        path: app/build/outputs/apk/embedNoRecord/debug/*.apk

    # ==========================================
    # СБОРКА RELEASE (Для RuStore)
    # ==========================================
    - name: Build Embed Release APK
      if: ${{ matrix.build_type == 'Release' }}
      run: bash ./gradlew assembleEmbedNoRecordRelease

    - name: Artifact (Bottle Flip Unsigned Release APK)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: Bottle-Flip-Release-Unsigned
        path: app/build/outputs/apk/embedNoRecord/release/*.apk
