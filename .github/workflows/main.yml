name: build

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4G'"
    steps:
    - name: Prepare Environment
      run: sudo apt-get update && curl -Lo kitware-archive.sh https://apt.kitware.com/kitware-archive.sh && sudo bash ./kitware-archive.sh
      
    - name: Install Dependencies
      run: sudo apt-get install ninja-build cmake
      
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: adopt-hotspot
        java-version: 17
        cache: gradle

    # Принудительно ставим правильный NDK и CMake
    - name: Install NDK and CMake
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    # Собираем сразу оба APK (Debug и Release) в одной задаче
    - name: Build APKs
      run: |
        bash ./gradlew assembleEmbedNoRecordDebug assembleEmbedNoRecordRelease --stacktrace

    # Загружаем все готовые файлы
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Bottle-Flip-APKs
        path: app/build/outputs/apk/embedNoRecord/**/*.apk
